<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#060810" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draft a World Cup XI and try to go 8-0."
    />
    <title>8and0</title>
    <script>
      // Pre-paint theme: set data-theme / data-accent on <html> before first
      // paint so there's no flash of the wrong colours. Mirrors ThemeProvider.
      (function () {
        try {
          var t = localStorage.getItem("eightZero:theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "system";
          var resolved = t === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : t;
          var a = localStorage.getItem("eightZero:accent") || "gold";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.accent = a;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.accent = "gold";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
